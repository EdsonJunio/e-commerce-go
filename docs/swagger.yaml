          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/e-commerce-go_internal_shared_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/e-commerce-go_internal_shared_response.ErrorResponse'
      summary: Delete a product
      tags:
      - products
    get:
      consumes:
      - application/json
      description: Retrieve specific product details by its ID
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/e-commerce-go_internal_catalog_domain.Product'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/e-commerce-go_internal_shared_response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/e-commerce-go_internal_shared_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/e-commerce-go_internal_shared_response.ErrorResponse'
      summary: Get product by ID
      tags:
      - products
    put:
      consumes:
      - application/json
      description: Update specific fields of a product by ID
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: integer
      - description: Update Data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_catalog_delivery_http.UpdateProductRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/e-commerce-go_internal_catalog_domain.Product'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/e-commerce-go_internal_shared_response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/e-commerce-go_internal_shared_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/e-commerce-go_internal_shared_response.ErrorResponse'
      summary: Update a product
      tags:
      - products
  /products/slug/{slug}:
    get:
      consumes:
      - application/json
      description: Retrieve specific product details by its Slug
      parameters:
      - description: Product Slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/e-commerce-go_internal_catalog_domain.Product'
        "400":
          description: Bad Request
          schema:
